    <!-- 鼠标点击特效 (烟花) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
      // 简单的点击烟花效果逻辑
      document.addEventListener('click', function(e) {
        // 如果点击的是弹窗遮罩或图片，不触发烟花，避免视线干扰
        if (e.target.id === 'custom-popup-mask' || e.target.id === 'custom-popup-img') return;

        confetti({
          origin: {
            x: e.clientX / window.innerWidth,
            y: e.clientY / window.innerHeight
          },
          spread: 80,
          particleCount: 60,
          scalar: 0.8
        });
      });

      // 弹窗显示函数
      function showPopup(src) {
        var mask = document.createElement('div');
        mask.id = 'custom-popup-mask';
        mask.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;";
        mask.onclick = function() { document.body.removeChild(mask); };
        
        var img = document.createElement('img');
        img.id = 'custom-popup-img';
        img.src = src;
        img.style.cssText = "max-width:90%;max-height:90%;border-radius:10px;box-shadow:0 0 20px rgba(0,0,0,0.5);cursor:default;";
        // 阻止点击图片消失
        img.onclick = function(e) { e.stopPropagation(); };
        
        mask.appendChild(img);
        document.body.appendChild(mask);
      }
    </script>
